version: '3.8'

services:
  arp-analyzer:
    build: .
    container_name: arp-network-analyzer
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    volumes:
      - ./snapshots:/app/snapshots
      - ./static:/app/static
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    stdin_open: true
    tty: true
